<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ข้อมูลสวน — สวนผลไม้ จังหวัดราชบุรี</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="garden-list.css">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
</head>
<body>

  <header class="navbar">
    <div class="brand">
      <img src="../img/fm.jpg" class="logo-img" alt="โลโก้">
      <div class="brand-text">
        <h1>สวนผลไม้ จังหวัดราชบุรี</h1>
        <small>ท่องเที่ยวเชิงเกษตรผลไม้ จ.ราชบุรี</small>
      </div>
    </div>
    <nav class="main-nav">
      <a href="index.html"><span> 🏠︎ </span> แดชบอร์ด</a>
      <a href="garden-list.html" class="active"><span> 🗎 </span> ข้อมูลสวน</a>
      <a href="bookings.html"><span> 🗓️ </span> การจอง</a>
      <a href="map.html"><span> 🌏︎ </span> แผนที่</a>
      <a href="account.html"><span>👤</span> บัญชี</a>
    </nav>
  </header>

  <main>
    <div class="toolbar">
      <span class="label">🌱 เลือกสวน</span>
      <div class="select-wrap">
        <select id="gardenSelect"></select>
      </div>
      <button type="button" class="btn-outline" id="editGardenBtn"> ✎ เพิ่มข้อมูล/แก้ไขข้อมูล</button>
      <button type="button" class="btn-neutral" onclick="location.href='add-garden1.html'">＋ เพิ่มสวน</button>
      <button type="button" class="btn-danger" id="deleteBtn">🗑 ลบสวน</button>
    </div>

    <div id="statusMessage">กำลังโหลดข้อมูลสวน...</div>
    <div class="detail-card" id="detailCard" style="display:none;"></div>
  </main>

  <!-- Modal -->
  <div class="modal-overlay" id="detailModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="detailModalTitle">รายละเอียด</h3>
        <button type="button" class="modal-close" id="detailModalClose">✕</button>
      </div>
      <div class="modal-body" id="detailModalBody"></div>
    </div>
  </div>

  <script src="auth.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
  <script src="garden-list.js"></script>

</body>
</html>
