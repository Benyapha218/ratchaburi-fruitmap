<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ข้อมูลผลไม้/ผลิตภัณฑ์ — สวนผลไม้ จังหวัดราชบุรี</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="type-price-fruit.css">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
</head>
<body>

  <header class="navbar">
    <div class="brand">
      <img src="../img/fm.jpg" class="logo-img">
      <div class="brand-text">
        <h1>สวนผลไม้ จังหวัดราชบุรี</h1>
        <small>ท่องเที่ยวเชิงเกษตรผลไม้ จ.ราชบุรี</small>
      </div>
    </div>
    <nav class="main-nav">
      <a href="index.html"><span> 🏠︎ </span> แดชบอร์ด</a>
      <a href="garden-list.html" class="active"><span> 🗎 </span> ข้อมูลสวน</a>
      <a href="bookings.html"><span> 🗓️ </span> การจอง</a>
      <a href="map.html"><span> 🌏︎ </span> แผนที่</a>
      <a href="account.html"><span>👤</span> บัญชี</a>
    </nav>
  </header>

  <div class="form-container">
    <div id="formMessage" style="margin-bottom:16px;"></div>

    <h2 class="section-title spaced">ประเภทผลไม้ และ ราคา</h2>
    <div id="productRows"></div>
    <button type="button" class="btn-add-more" id="addProductRowBtn">
      <span class="icon-plus">+</span> เพิ่มผลไม้
    </button>

    <div class="section-title">ข้อมูลฤดูกาลผลไม้</div>
    <div id="seasonRows"></div>
    <button type="button" class="btn-add-more" id="addSeasonRowBtn">
      <span class="icon-plus">+</span> เพิ่มฤดูกาลผลไม้
    </button>

    <div class="section-title">
      ช่องทางการขายออนไลน์
      <span class="sub-title">(เลือกช่องทางการขาย)</span>
    </div>
    <div class="checkbox-group">
      <label class="checkbox-item">
        <input type="checkbox" name="onlineChannel" value="facebook">
        <span class="social-icon facebook">f</span>
        Facebook
      </label>
      <label class="checkbox-item">
        <input type="checkbox" name="onlineChannel" value="line">
        <span class="social-icon line">L</span>
        Line
      </label>
    </div>

    <div class="section-title">ช่องทางการขายออฟไลน์/ตลาดส่งขาย</div>
    <div id="offlineRows"></div>
    <button type="button" class="btn-add-more" id="addOfflineRowBtn">
      <span class="icon-plus">+</span> เพิ่มตลาด
    </button>

    <div class="action-buttons">
      <button type="button" class="btn-save-main" id="saveBtn">บันทึกข้อมูล</button>
      <button type="button" class="btn-back-main" onclick="history.back()">กลับ</button>
    </div>
  </div>

  <script src="auth.js"></script>
  <script src="type-price-fruit.js"></script>

</body>
</html>
