<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>แดชบอร์ด — สวนผลไม้ จังหวัดราชบุรี</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="index.css">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
</head>
<body>

  <header class="navbar">
    <div class="brand">
      <img src="../img/fm.jpg" class="logo-img">
      <div class="brand-text">
        <h1>สวนผลไม้ จังหวัดราชบุรี</h1>
        <small>ท่องเที่ยวเชิงเกษตรผลไม้ จ.ราชบุรี</small>
      </div>
    </div>

    <nav class="main-nav">
      <a href="index.html" class="active"><span> 🏠︎ </span> แดชบอร์ด</a>
      <a href="garden-list.html"><span> 🗎 </span> ข้อมูลสวน</a>
      <a href="bookings.html"><span> 🗓️ </span> การจอง</a>
      <a href="map.html"><span> 🌏︎ </span> แผนที่</a>
      <a href="account.html"><span>👤</span> บัญชี</a>
    </nav>
  </header>

  <main>
    <div class="toolbar">
      <span class="label">🌱 เลือกสวน</span>
      <div class="select-wrap">
        <select id="gardenSelect"></select>
      </div>
    </div>

    <section class="stats-row">
      <div class="stat-card">
        <div class="stat-title">รออนุมัติ ☰✔</div>
        <div class="stat-value" id="statPending">--</div>
      </div>
      <div class="stat-card">
        <div class="stat-title">จำนวนรีวิว ★</div>
        <div class="stat-value" id="statReviews">--</div>
      </div>
      <div class="stat-card">
        <div class="stat-title">คะแนนเฉลี่ย ☆</div>
        <div class="stat-value" id="statAvgScore">--</div>
      </div>
    </section>

    <section class="charts-row">
      <div class="chart-card">
        <div class="chart-header">
          <h2>ยอดจอง</h2>
          <div class="year-switch">
            <button type="button" id="prevYearBtn" aria-label="ปีก่อนหน้า">◀</button>
            <span id="currentYearLabel">ปี 2569</span>
            <button type="button" id="nextYearBtn" aria-label="ปีถัดไป">▶</button>
          </div>
        </div>
        <p class="chart-subtitle">ยอดการจอง(รายเดือน 12 เดือนล่าสุด)</p>
        <div class="chart-frame">
          <svg viewBox="0 0 560 220" preserveAspectRatio="none">
            <!-- เส้นกริดและแกน Y ของกราฟยอดจอง -->
            <line class="axis-line" x1="30" y1="20" x2="560" y2="20"></line>
            <line class="axis-line" x1="30" y1="180" x2="560" y2="180"></line>
            <text class="axis-label" id="bookingTopAxis" x="10" y="24">5</text>
            <text class="axis-label" x="10" y="184">0</text>

            <g class="month-label">
              <text x="45" y="200">ม.ค.</text><text x="88" y="200">ก.พ.</text><text x="131" y="200">มี.ค.</text>
              <text x="174" y="200">เม.ย.</text><text x="217" y="200">พ.ค.</text><text x="260" y="200">มิ.ย.</text>
              <text x="303" y="200">ก.ค.</text><text x="346" y="200">ส.ค.</text><text x="389" y="200">ก.ย.</text>
              <text x="432" y="200">ต.ค.</text><text x="475" y="200">พ.ย.</text><text x="518" y="200">ธ.ค.</text>
            </g>
          </svg>
        </div>
      </div>

      <div class="chart-card">
        <div class="chart-header">
          <h2>คะแนนรีวิวเฉลี่ย</h2>
          <div class="year-switch">
            <!-- ใช้ปีเดียวกันควบคุม หรือแยกปุ่มก็ได้ แต่แนะนำให้กดเปลี่ยนพร้อมกันทั้ง 2 กราฟ -->
            <button type="button" id="prevYearBtn2" aria-label="ปีก่อนหน้า">◀</button>
            <span id="currentYearLabel2">ปี 2569</span>
            <button type="button" id="nextYearBtn2" aria-label="ปีถัดไป">▶</button>
          </div>
        </div>
        <p class="chart-subtitle">คะแนนรีวิวเฉลี่ย(รายเดือน)</p>
        <div class="chart-frame">
          <svg viewBox="0 0 560 220" preserveAspectRatio="none">
            <line class="axis-line" x1="30" y1="20" x2="560" y2="20"></line>
            <line class="axis-line" x1="30" y1="52" x2="560" y2="52"></line>
            <line class="axis-line" x1="30" y1="84" x2="560" y2="84"></line>
            <line class="axis-line" x1="30" y1="116" x2="560" y2="116"></line>
            <line class="axis-line" x1="30" y1="148" x2="560" y2="148"></line>
            <line class="axis-line" x1="30" y1="180" x2="560" y2="180"></line>
            <text class="axis-label" x="10" y="24">5</text>
            <text class="axis-label" x="10" y="56">4</text>
            <text class="axis-label" x="10" y="88">3</text>
            <text class="axis-label" x="10" y="120">2</text>
            <text class="axis-label" x="10" y="152">1</text>
            <text class="axis-label" x="10" y="184">0</text>

            <g class="month-label">
              <text x="45" y="200">ม.ค.</text><text x="88" y="200">ก.พ.</text><text x="131" y="200">มี.ค.</text>
              <text x="174" y="200">เม.ย.</text><text x="217" y="200">พ.ค.</text><text x="260" y="200">มิ.ย.</text><text x="303" y="200">ก.ค.</text>
              <text x="346" y="200">ส.ค.</text><text x="389" y="200">ก.ย.</text><text x="432" y="200">ต.ค.</text>
              <text x="475" y="200">พ.ย.</text><text x="518" y="200">ธ.ค.</text>
            </g>
          </svg>
        </div>
      </div>
    </section>
  </main>

  <script src="auth.js"></script>
  <script src="index.js"></script>

</body>
</html>
