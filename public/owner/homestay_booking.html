<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>จัดการสถานะห้องพัก Homestay — สวนผลไม้ จังหวัดราชบุรี</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="homestay_booking.css">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>

  <header class="navbar">
    <div class="brand">
      <img src="../img/fm.jpg" class="logo-img">
      <div class="brand-text">
        <h1>สวนผลไม้ จังหวัดราชบุรี</h1>
        <small>ท่องเที่ยวเชิงเกษตรผลไม้ จ.ราชบุรี</small>
      </div>
    </div>
    <nav class="main-nav">
      <a href="index.html"><span> 🏠︎ </span> แดชบอร์ด</a>
      <a href="garden-list.html" class="active"><span> 🗎 </span> ข้อมูลสวน</a>
      <a href="bookings.html"><span> 🗓️ </span> การจอง</a>
      <a href="map.html"><span> 🌏︎ </span> แผนที่</a>
      <a href="account.html"><span>👤</span> บัญชี</a>
    </nav>
  </header>

  <div class="form-container" style="max-width: 1400px; margin: 0 auto; padding: 0 20px 40px;">
    <div class="main-card" style="max-width: 100% !important;">

      <div class="section-title">
        จัดการสถานะห้องพัก Homestay (รายเดือน)
        <span class="sub-title">(คลิกที่ช่องตารางเพื่อสลับสถานะ: ว่าง ⇄ ไม่ว่าง)</span>
      </div>

      <div id="formMessage"></div>

      <div class="calendar-controls" style="display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 24px;">
        <button type="button" class="nav-btn" id="prevMonthBtn">◀</button>
        <div class="month-year" id="monthYearLabel" style="font-size: 18px; font-weight: 700; color: #2d4d40;"></div>
        <button type="button" class="nav-btn" id="nextMonthBtn">▶</button>
      </div>

      <div class="legend-box-row" style="display: flex; gap: 20px; margin-bottom: 16px; font-size: 13px; font-weight: 600;">
        <div style="display: flex; align-items: center; gap: 6px;"><span style="width: 16px; height: 16px; background: #dcfce7; border: 1px solid #22c55e; border-radius: 4px; display:inline-block;"></span> ว่าง (✓)</div>
        <div style="display: flex; align-items: center; gap: 6px;"><span style="width: 16px; height: 16px; background: #fee2e2; border: 1px solid #ef4444; border-radius: 4px; display:inline-block;"></span> ไม่ว่าง / เต็ม (✕)</div>
      </div>

      <div class="table-responsive" style="overflow-x: auto; margin-bottom: 28px; border: 1px solid #e5e7eb; border-radius: 12px;">
        <table class="matrix-table" id="matrixTable" style="width: 100%; border-collapse: collapse; background: #fff; text-align: center; font-size: 13px;">
          <thead>
            <tr style="background: #2d4d40; color: #fff;">
              <th style="padding: 12px; text-align: left; min-width: 180px; position: sticky; left: 0; background: #2d4d40; z-index: 2;">ประเภทห้องพัก</th>
            </tr>
          </thead>
          <tbody id="matrixBody"></tbody>
        </table>
      </div>

      <div class="action-buttons">
        <button type="button" class="btn-save-main" id="saveBtn">บันทึกสถานะทั้งหมด</button>
        <button type="button" class="btn-back-main" onclick="history.back()">กลับ</button>
      </div>

    </div>
  </div>

  <script src="auth.js"></script>
  <script src="homestay_booking.js"></script>

</body>
</html>
