<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สมัคร — เจ้าของสวน</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="register.css">
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
</head>
<body>

    <div class="card">
    <div class="logo-wrap">
        <img src="../img/fm.jpg" alt="โลโก้แผนที่ท่องเที่ยวเชิงเกษตรผลไม้ ราชบุรี" class="logo-img">
    </div>


    <h2 class="section-title">สมัครเป็นเจ้าของสวน</h2>
    <p class="section-subtitle">สร้างบัญชีเพื่อจัดการสวน คิวเข้าชม และ Homestay</p>

    <form id="registerForm">
      <label for="displayName">ชื่อที่แสดง / ชื่อสวน</label>
      <input type="text" id="displayName" name="displayName" placeholder="เช่น สวนคุณลุงมานะ" required>

      <label for="email">อีเมล</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" required>

      <label for="password">รหัสผ่าน</label>
      <input type="password" id="password" name="password" placeholder="อย่างน้อย 6 ตัวอักษร" minlength="6" required>

      <button type="submit" class="btn-submit" id="submitBtn">สมัครเจ้าของสวน</button>

      <div id="formMessage"></div>
    </form>

    <div class="footer-links">
      มีบัญชีแล้ว? <a href="login.html">เข้าสู่ระบบ</a>
      <a href="../customer/register.html" class="secondary">กลับหน้าแรก</a>
    </div>
  </div>
  <script src="register.js"></script>
</body>
</html>
